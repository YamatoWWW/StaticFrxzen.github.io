<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cyberpunk link-in-bio profile page — premium glassmorphism, neon presence widgets, crypto wallet vault and more." />
  <meta name="theme-color" content="#04050a" />
  <title>link in bio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2300e5ff'/><stop offset='1' stop-color='%23ff2d95'/></linearGradient></defs><polygon points='50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5' fill='url(%23g)'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="no-js locked">

  <!-- ==============================================================
       SPLASH SCREEN — unskippable "click to enter" gate
  ============================================================== -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-core">
      <div class="splash-visual">
        <div class="splash-ring"></div>
        <div class="splash-sigil"><span id="splash-letter">?</span></div>
      </div>
      <h1 class="splash-title"><span id="splash-typed"></span><span class="caret"></span></h1>
      <p class="splash-sub" id="splash-sub"></p>
      <button class="splash-btn" id="splash-btn" type="button">
        <span>CLICK TO ENTER</span>
      </button>
      <p class="splash-note" id="splash-note"></p>
    </div>
  </div>

  <!-- ==============================================================
       BACKGROUND — looping video OR particle canvas (toggle bottom-right)
  ============================================================== -->
  <div class="bg" id="bg" aria-hidden="true">
    <video id="bg-video" class="bg-video" muted loop playsinline preload="metadata"></video>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
    <button class="bg-toggle" id="bg-toggle" type="button" title="cycle background mode">&#10022;</button>
  </div>

  <!-- ==============================================================
       CUSTOM CURSOR — trailing dot + ring + trail
  ============================================================== -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>
  <div class="cursor-trail" id="cursor-trail" aria-hidden="true"></div>

  <!-- ==============================================================
       MAIN PROFILE — glass card + widgets (stagger-revealed)
  ============================================================== -->
  <main class="main" id="main">
    <div class="container">

      <header class="profile glass" data-reveal>
        <div class="profile-inner">
          <div class="avatar-wrap">
            <div class="avatar-scan"></div>
            <img class="avatar" id="avatar" alt="profile avatar" />
            <span class="status-dot online" id="profile-status" title="presence"></span>
          </div>
          <h1 class="username" id="username">…</h1>
          <span class="handle" id="handle"></span>
          <div class="typewriter-row">
            <span class="typewriter-prefix" id="typewriter-prefix"></span>
            <span class="typewriter-text" id="typewriter-text"></span>
            <span class="typewriter-caret"></span>
          </div>
        </div>
      </header>

      <!-- ================= DISCORD / RICH PRESENCE ================= -->
      <section class="widget discord glass" data-reveal>
        <div class="widget-head">
          <span class="widget-title"><span class="title-bar"></span>DISCORD PRESENCE</span>
          <span class="widget-badge live" id="discord-badge"><span class="badge-dot"></span>LIVE</span>
        </div>
        <div class="discord-user">
          <div class="discord-avatar-frame">
            <img class="discord-avatar" id="discord-avatar" alt="discord avatar" />
            <span class="status-dot online" id="discord-status-dot"></span>
          </div>
          <div class="discord-user-meta">
            <span class="discord-username" id="discord-username"></span>
            <span class="discord-tag" id="discord-tag"></span>
            <span class="discord-status-text" id="discord-status-text">ONLINE</span>
          </div>
        </div>
        <div class="rich-presence" id="rich-presence">
          <div class="rp-cover">
            <img id="rp-cover" alt="activity art" />
            <span class="rp-overlay-icon">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
            </span>
          </div>
          <div class="rp-meta">
            <span class="rp-overline" id="rp-overline">PLAYING A GAME</span>
            <span class="rp-title" id="rp-title"></span>
            <span class="rp-details" id="rp-details"></span>
            <span class="rp-time" id="rp-time"></span>
          </div>
        </div>
      </section>

      <!-- ================= MUSIC / AUDIO PLAYER ================= -->
      <section class="widget music glass" data-reveal>
        <div class="widget-head">
          <span class="widget-title"><span class="title-bar"></span>NOW PLAYING</span>
          <span class="widget-badge" id="eq-badge"><span class="badge-dot"></span>PAUSED</span>
        </div>
        <div class="music-top">
          <div class="music-art-wrap">
            <div class="music-art"><img id="music-art-img" alt="track art" /></div>
          </div>
          <div class="music-meta">
            <span class="music-title" id="music-title"></span>
            <span class="music-artist" id="music-artist"></span>
            <span class="music-source" id="music-source"></span>
          </div>
        </div>
        <div class="visualizer" id="visualizer" aria-hidden="true"></div>
        <div class="progress-row">
          <span class="time" id="time-current">0:00</span>
          <div class="progress" id="progress">
            <div class="progress-fill" id="progress-fill"><span class="progress-thumb"></span></div>
          </div>
          <span class="time" id="time-total">0:00</span>
        </div>
        <div class="music-controls">
          <button class="ctrl" id="btn-prev" type="button" aria-label="previous track"></button>
          <button class="ctrl ctrl-main" id="btn-play" type="button" aria-label="play / pause"></button>
          <button class="ctrl" id="btn-next" type="button" aria-label="next track"></button>
          <button class="ctrl" id="btn-mute" type="button" aria-label="mute / unmute"></button>
        </div>
      </section>

      <!-- ================= CRYPTO WALLET VAULT ================= -->
      <section class="widget wallet glass" data-reveal>
        <div class="widget-head">
          <span class="widget-title"><span class="title-bar"></span>WALLET VAULT</span>
          <span class="widget-badge">CLICK TO COPY</span>
        </div>
        <div class="wallet-tabs" id="wallet-tabs" role="tablist"></div>
        <div class="wallet-body">
          <canvas class="qr-canvas" id="qr-canvas" aria-hidden="true"></canvas>
          <div class="wallet-info">
            <span class="wallet-network" id="wallet-network"></span>
            <span class="wallet-address" id="wallet-address"></span>
            <button class="copy-btn" id="btn-copy" type="button">
              <span class="copy-icon" id="copy-icon"></span>
              <span id="copy-label">COPY ADDRESS</span>
            </button>
          </div>
        </div>
      </section>

      <!-- ================= SOCIAL LINKS ================= -->
      <section class="widget socials glass" data-reveal>
        <div class="widget-head">
          <span class="widget-title"><span class="title-bar"></span>CONNECT</span>
        </div>
        <div class="socials-grid" id="socials-grid"></div>
      </section>

      <!-- ================= STATS / SOCIAL PROOF ================= -->
      <section class="widget stats glass" data-reveal>
        <div class="stat">
          <span class="stat-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </span>
          <div class="stat-nums"><strong id="view-count">0</strong><span>PROFILE VIEWS</span></div>
        </div>
        <button class="stat stat-btn" id="heart-btn" type="button">
          <span class="stat-icon" id="heart-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </span>
          <div class="stat-nums"><strong id="heart-count">0</strong><span>HEARTS</span></div>
          <div class="heart-burst" id="heart-burst"></div>
        </button>
      </section>

      <footer class="foot" data-reveal>
        <span id="foot-line"></span>
        <span class="foot-ver">STYLE v2.0.4</span>
      </footer>

    </div>
  </main>

  <!-- ================= GLOBAL TOAST ================= -->
  <div class="toast" id="toast" role="status"></div>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
