<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Link in bio — minimal luxury profile." />
  <title>link in bio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="no-js">

  <!-- SPLASH -->
  <div class="splash" id="splash">
    <div class="splash-inner">
      <p class="splash-name" id="splash-name"></p>
      <p class="splash-enter">click to enter</p>
    </div>
  </div>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="container">

      <section class="card" data-reveal>
        <div class="profile">
          <div class="avatar-wrap">
            <img class="avatar" id="avatar" alt="avatar" />
          </div>
          <h1 class="username" id="username"></h1>
          <p class="handle" id="handle"></p>
          <div class="bio-row">
            <span class="bio-text" id="bio-text"></span><span class="caret"></span>
          </div>
        </div>
      </section>

      <section class="card" data-reveal>
        <div class="section-label">DISCORD</div>
        <div class="discord">
          <div class="discord-left">
            <div class="discord-avatar-wrap">
              <img class="discord-avatar" id="discord-avatar" alt="discord avatar" />
              <span class="status-dot" id="discord-status-dot"></span>
            </div>
            <div class="discord-meta">
              <span class="discord-name" id="discord-name"></span>
              <span class="discord-tag" id="discord-tag"></span>
            </div>
          </div>
          <div class="rich-presence" id="rich-presence">
            <img class="rp-art" id="rp-cover" alt="activity" />
            <div class="rp-info">
              <span class="rp-activity" id="rp-overline"></span>
              <span class="rp-game" id="rp-title"></span>
              <span class="rp-details" id="rp-details"></span>
              <span class="rp-time" id="rp-time"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="card" data-reveal>
        <div class="section-label">MUSIC</div>
        <div class="player">
          <div class="player-top">
            <div class="player-art">
              <img id="music-art-img" alt="art" />
            </div>
            <div class="player-meta">
              <span class="player-title" id="music-title"></span>
              <span class="player-artist" id="music-artist"></span>
            </div>
            <button class="play-btn" id="btn-play" type="button" aria-label="play"></button>
          </div>
          <div class="progress">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="player-time">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
          <div class="player-controls">
            <button class="ctrl-btn" id="btn-prev" type="button" aria-label="previous">⟨</button>
            <button class="ctrl-btn" id="btn-next" type="button" aria-label="next">⟩</button>
          </div>
        </div>
      </section>

      <section class="card" data-reveal>
        <div class="section-label">WALLET</div>
        <div class="wallet">
          <div class="wallet-tabs" id="wallet-tabs" role="tablist"></div>
          <div class="wallet-body">
            <canvas class="qr" id="qr-canvas" aria-hidden="true"></canvas>
            <div class="wallet-info">
              <span class="wallet-network" id="wallet-network"></span>
              <span class="wallet-address" id="wallet-address"></span>
              <button class="copy-btn" id="btn-copy" type="button">copy</button>
            </div>
          </div>
        </div>
      </section>

      <section class="card" data-reveal>
        <div class="section-label">SOCIALS</div>
        <div class="socials" id="socials-grid"></div>
      </section>

      <section class="card stats-card" data-reveal>
        <div class="stat">
          <span class="stat-num" id="view-count">0</span>
          <span class="stat-label">views</span>
        </div>
        <div class="stat-divider"></div>
        <button class="stat stat-btn" id="heart-btn" type="button">
          <span class="stat-num" id="heart-count">0</span>
          <span class="stat-label">hearts</span>
        </button>
      </section>

      <footer class="footer" data-reveal>
        <span id="foot-line"></span>
      </footer>

    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <audio id="audio" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
